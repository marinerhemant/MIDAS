[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "midas-snapshot"
version = "0.1.0"
description = "Still-frame (no rotation) diffraction time series: per-frame matrix scale and halo traces, calibrated sparse-spot detection, feature linking, measured detection limits and candidate-cell tests with nulls and negative controls."
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.9"
authors = [{name = "MIDAS maintainers"}]
keywords = ["MIDAS", "diffraction", "in situ", "still frames", "single shot", "synchrotron"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.9",
    "tifffile>=2023.0",
    # Floors are the releases that ship the snapshot primitives this package calls:
    # snapshot_detect / tracks (peakfit), feature_phase / structure_sources (hkls),
    # streaming.snapshot_profile (integrate-v2). Bump together at release.
    "midas-peakfit>=0.7.0",
    "midas-hkls>=0.16.0",
    "midas-integrate-v2>=0.8.0",
    "midas-defect>=0.8.0",       # detector geometry: pixel -> scattering angle
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
plot = ["matplotlib>=3.5"]

[project.scripts]
midas-snapshot = "midas_snapshot.cli:main"

[project.urls]
Homepage = "https://github.com/marinerhemant/MIDAS"
Documentation = "https://github.com/marinerhemant/MIDAS/tree/master/manuals/snapshot-xrd"
Issues = "https://github.com/marinerhemant/MIDAS/issues"

[tool.setuptools.packages.find]
include = ["midas_snapshot*"]
