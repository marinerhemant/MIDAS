[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "midas-params"
version = "0.11.0"
description = "MIDAS parameter-file registry, validator, and wizard for FF/NF/PF/RI pipelines"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.9"
authors = [
    {name = "Hemant Sharma", email = "hsharma@anl.gov"},
]
keywords = [
    "MIDAS", "HEDM", "parameters", "validation", "wizard",
    "far-field", "near-field", "diffraction",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
]
# No hard runtime dependencies — pure stdlib for the core registry + validator.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# Discovery module will eventually need these for HDF5/Zarr introspection.
# hdf5plugin belongs HERE and not in base dependencies: this package keeps
# `dependencies = []` on purpose (it is the leaf everything else imports), and
# the only HDF5 reads are discovery.py's guarded ones. It is listed at all
# because __init__ imports it to register the bitshuffle/LZ4/zstd plugin
# binaries -- that import is try/except, so without this the registration
# silently does not happen and an Eiger/ESRF file fails to read with
# "can't open directory (/usr/local/lib/plugin)" rather than an ImportError.
discovery = ["h5py>=3.0", "zarr>=2.0", "numpy>=1.22", "hdf5plugin>=4.0"]

[project.urls]
Homepage = "https://github.com/marinerhemant/MIDAS"
Documentation = "https://github.com/marinerhemant/MIDAS/tree/master/manuals"
Issues = "https://github.com/marinerhemant/MIDAS/issues"

[project.scripts]
midas-params = "midas_params.cli:main"

[tool.setuptools.packages.find]
where = ["."]
