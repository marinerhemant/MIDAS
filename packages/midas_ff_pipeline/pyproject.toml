[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "midas-ff-pipeline"
version = "0.7.0"
description = "[RETIRED] Argv shim that delegates to midas-pipeline. Use midas-pipeline run --scan-mode ff instead; removed at 1.0.0."
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.9"
authors = [
    {name = "Hemant Sharma", email = "hsharma@anl.gov"},
]
keywords = [
    "MIDAS", "HEDM", "FF-HEDM", "diffraction", "pipeline",
    "PyTorch", "multi-detector", "crystallography", "polycrystal",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    # The delegate target, and now the ONLY dependency. `cli.main()` rewrites
    # argv and hands it to `midas_pipeline.cli.main`; `testing.py` re-exports
    # `midas_pipeline.testing`. Nothing else is imported any more -- the stage
    # tree, config, detector, discovery, dispatch, eta_coverage, provenance,
    # seeding, sr_midas and results were deleted at 0.7.0 rather than kept in
    # two places, so the seventeen dependencies they pulled in went with them.
    # >=0.15.0: refinement is c-omp only, which is what translate_argv's
    # _FLAG_DROPPED table assumes when it strips --loss/--mode/--solver.
    "midas-pipeline>=0.15.0",
    # Optional at runtime -- `__init__` imports it inside a try/except so HDF5
    # files with no plugin filter still read. Declared because the delegated
    # pipeline effectively always wants it present.
    "hdf5plugin>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "matplotlib", "ipykernel"]
notebook = ["matplotlib", "ipykernel", "jupyter"]

[project.scripts]
midas-ff-pipeline = "midas_ff_pipeline.cli:main"

[project.urls]
Homepage = "https://github.com/marinerhemant/MIDAS"
Documentation = "https://github.com/marinerhemant/MIDAS"
Issues = "https://github.com/marinerhemant/MIDAS/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["midas_ff_pipeline*"]

[tool.setuptools.package-data]
midas_ff_pipeline = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
