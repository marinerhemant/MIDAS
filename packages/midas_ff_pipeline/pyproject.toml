[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "midas-ff-pipeline"
version = "0.4.3"
description = "[DEPRECATED] End-to-end pure-Python FF-HEDM workflow orchestrator (1-N detectors). Use midas-pipeline run --scan-mode ff instead."
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.9"
authors = [
    {name = "Hemant Sharma", email = "hsharma@anl.gov"},
]
keywords = [
    "MIDAS", "HEDM", "FF-HEDM", "diffraction", "pipeline",
    "PyTorch", "multi-detector", "crystallography", "polycrystal",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.22",
    "torch>=2.0",
    "zarr>=2.14,<3",
    "h5py>=3.7",
    "hdf5plugin>=4.0",
    "tifffile",
    "pandas>=1.5",
    # Sibling MIDAS packages.
    # >=0.1.5: this package invokes the zipper, and 0.1.4 drops BgSubtract,
    # BgNSectors and MinPeakSNR from the param file it writes -- the peak search
    # then runs at the defaults with no error. Matches midas-pipeline.
    "midas-zipper>=0.1.5",                # raw → .MIDAS.zip ingest (pip-portable)
    "midas-hkls>=0.2.0",
    "midas-peakfit>=0.4.6",
    "midas-transforms>=0.8.2",
    "midas-index>=0.3.0",
    # Both floors are silent-wrong-answer gates, not import breaks. Below
    # fit-grain 0.7.0 the refiner ships without the c_recipe mode; below
    # process-grains 0.7.0 the grain-selection keys (Completeness, MinNrSpots)
    # are parsed and discarded -- a measured 23710-vs-6132 grain discrepancy
    # from the same refiner output. Matches midas-pipeline (3d9bb427).
    "midas-fit-grain>=0.7.0",
    "midas-process-grains>=0.7.0",
    "midas-diffract>=0.1.0",
    "midas-parsl-configs>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "matplotlib", "ipykernel"]
notebook = ["matplotlib", "ipykernel", "jupyter"]

[project.scripts]
midas-ff-pipeline = "midas_ff_pipeline.cli:main"

[project.urls]
Homepage = "https://github.com/marinerhemant/MIDAS"
Documentation = "https://github.com/marinerhemant/MIDAS"
Issues = "https://github.com/marinerhemant/MIDAS/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["midas_ff_pipeline*"]

[tool.setuptools.package-data]
midas_ff_pipeline = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
