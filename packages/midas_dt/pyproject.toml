[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "midas-dt"
version = "0.1.0.dev0"
description = "Diffraction / X-ray computed tomography (XRD-CT): scan model, sinogram assembly with error propagation, reconstruction and per-voxel peak fitting."
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.9"
authors = [{name = "Hemant Sharma", email = "hsharma@anl.gov"}]
keywords = ["MIDAS", "XRD-CT", "diffraction tomography", "DT", "synchrotron", "chemical tomography"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.22",
    "midas-tomo>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
full = [
    "midas-integrate-v2>=0.3.1",
    "midas-peakfit>=0.5.0",
    "midas-hkls>=0.6.0",
    "midas-stress>=0.8.1",
]

[project.scripts]
midas-dt = "midas_dt.cli:main"

[project.urls]
Homepage = "https://github.com/marinerhemant/MIDAS"
Issues = "https://github.com/marinerhemant/MIDAS/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["midas_dt*"]

[tool.pytest.ini_options]
markers = [
    "realdata: needs the U3O8 scan on haydn (see conventions.py)",
    "slow: full-scan reductions",
]
