[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "midas-dt"
version = "0.7.0"
description = "Diffraction / X-ray computed tomography (XRD-CT): scan model, sinogram assembly with error propagation, reconstruction and per-voxel peak fitting."
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.9"
authors = [{name = "Hemant Sharma", email = "hsharma@anl.gov"}]
keywords = ["MIDAS", "XRD-CT", "diffraction tomography", "DT", "synchrotron", "chemical tomography"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "hdf5plugin>=4.0",
    "midas-params>=0.9.0",  # preflight: CLI errors + path checks
    "numpy>=1.22",
    "midas-tomo>=0.1.0",
    # Reduction (raw frames -> sinograms) is this package's primary path, not an
    # optional extra: FrameReducer, and therefore the whole documented workflow,
    # cannot run without it. It lived in [full] until 2026-08-14, which meant a
    # plain `pip install midas-dt` produced a package that could not build the
    # sinograms the README advertised. Brings torch>=2.1 with it.
    #
    # Raised to 0.3.2 for correctness, not for a feature. DTGeometry sets
    # ``ResidualCorrectionMap`` in the IntegrationSpec it hands to v2; below
    # 0.3.2 the v2 binning path *declares that field and silently ignores it*,
    # so every integration discards the residual the calibration measured and
    # nothing reports a problem. The failure is a slightly wrong radius, not an
    # error, which is why the floor has to carry it.
    "midas-integrate-v2>=0.7.0",
    # Floored for the macOS fix, not for a feature: 0.4.3 selects numba's
    # workqueue threading layer on darwin. Below it, calibration and any
    # midas-dt reduction SEGFAULT on a Mac -- numba's OpenMP layer colliding
    # with torch's. midas-integrate-v2 pulls this in transitively; the floor is
    # stated here so resolution cannot land on a crashing one.
    "midas-integrate>=0.7.0",
    # rings.find_rings (choosing channels) and peakfit.fit_lineout (every
    # per-voxel fit) both need it. Same reason: not optional in practice.
    "scipy>=1.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# Branch C (direct inversion), SIRT/TV and the absorption operator. torch and
# scipy are core now (they arrive with midas-integrate-v2), so this adds only
# the optimiser.
direct = [
    "midas-invert>=0.1.1",
]
# Ring indexing against candidate phases (midas_dt.index_rings).
indexing = [
    "midas-hkls>=0.6.0",
]
# Texture / ODF: midas_dt.gsh, midas_dt.texture_kernel, midas_dt.odf_uniaxial.
# These are imported LAZILY by __init__ (PEP 562) because their floors sit above
# the core ones and every reconstruction path works without them.
#
# The floors are for correctness, not features:
#   * scipy>=1.15 -- gsh uses scipy.special.sph_harm_y. The predecessor
#     `sph_harm` takes its arguments in the OPPOSITE order (azimuth before
#     polar). Silently swapping them gives a transposed pole figure that is still
#     smooth, still symmetric, and wrong, so this floor must exclude the older
#     function rather than shim around it.
#   * numpy>=2.0 -- np.trapezoid, used for the Haar-measure quadrature in
#     texture_kernel and the Hermans-parameter quadrature in odf_uniaxial.
#   * midas-hkls>=0.7.3 -- point_group.proper_rotations_from_space_group, i.e.
#     symmetry for anything but cubic. 0.7.3 is the release that adds it; below
#     that, SymGSH.families raises ImportError rather than guessing.
texture = [
    "midas-hkls>=0.7.3",
    "scipy>=1.15",
    "numpy>=2.0",
]
# Everything optional. midas-peakfit and midas-stress were listed here until
# 2026-08-14 and are NOT imported anywhere in this package -- peakfit.py names
# midas_peakfit in its docstring as the design it mirrors, but fits with
# scipy.optimize directly. Dropped rather than carried as dead weight.
full = [
    "midas-invert>=0.1.1",
    "midas-hkls>=0.7.3",
    "scipy>=1.15",
    "numpy>=2.0",
]

[project.scripts]
midas-dt = "midas_dt.cli:main"

[project.urls]
Homepage = "https://github.com/marinerhemant/MIDAS"
Issues = "https://github.com/marinerhemant/MIDAS/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["midas_dt*"]

[tool.pytest.ini_options]
markers = [
    "realdata: needs the U3O8 scan on haydn (see conventions.py)",
    "slow: full-scan reductions",
]
