[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "midas-nf-pipeline"
version = "0.6.4"
description = "Pure-Python NF-HEDM pipeline orchestrator (single + multi-resolution, multi-layer) — drop-in replacement for nf_MIDAS.py / nf_MIDAS_Multiple_Resolutions.py"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.9"
authors = [
    {name = "Hemant Sharma", email = "hsharma@anl.gov"},
]
keywords = [
    "MIDAS", "NF-HEDM", "near-field", "diffraction", "PyTorch",
    "orientation fitting", "pipeline", "workflow",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "midas-params>=0.9.0",  # preflight: CLI errors + path checks
    "numpy>=1.22",
    "h5py>=3.0",
    "hdf5plugin>=4.0",
    "tqdm>=4.0",
    # >=0.6.0: write_nf_hkls_csv(atoms=...) + midas_hkls.Atom, used by
    # stages._build_hkls for structure-factor aware reflections.
    "midas-hkls>=0.6.0",
    "midas-stress>=0.6.0",
    # >=0.6.0: torch NLM backend + matched-filter spot detection, the
    # beam_calib shadow-phase -> sample-position fix, AND SumFrames-is-internal
    # (a7c50926). The last one is why these two floors move together: below
    # them a resolve can mix a package that reads NrFilesPerDistance/OmegaStep
    # as RAW with one that reads them as POST-SUM. That mismatch raises no
    # error -- the reduction and the fit agree on a frame count derived from
    # the same wrong key -- and every spot lands at the wrong omega.
    # midas-suite has floored these since 9450901d; this list had not.
    "midas-nf-preprocess>=0.6.0",
    # >=0.8.0: as above, plus the refine (not just the search) is
    # structure-factor weighted. Below 0.6.0 a weighted ConfidenceMetric writes
    # UNWEIGHTED confidence to the .mic -- silently wrong numbers, not an error.
    "midas-nf-fitorientation>=0.9.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]
denoise = ["MIDAS-NF-preProc"]

[project.scripts]
midas-nf-pipeline = "midas_nf_pipeline.cli:main"

[project.urls]
Homepage = "https://github.com/marinerhemant/MIDAS"
Issues = "https://github.com/marinerhemant/MIDAS/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["midas_nf_pipeline*"]

[tool.pytest.ini_options]
markers = [
    "slow: long-running tests",
    "gpu: tests that require CUDA",
    "integration: tests that exercise the full Au end-to-end pipeline",
]
