[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "midas-pink"
version = "0.1.0"
description = "Pink-beam HEDM with spectrum-aware differentiable inversion (extends midas-diffract from mono to arbitrary S(E))"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.9"
authors = [
    {name = "Hemant Sharma", email = "hsharma@anl.gov"},
]
keywords = [
    "HEDM", "3DXRD", "pink beam", "polychromatic",
    "differentiable physics", "PyTorch", "spectrum",
    "mosaicity", "time-resolved", "in-situ",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.22",
    "torch>=2.0",
    "midas-diffract>=0.1.0",
    "midas-hkls>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]
plots = ["matplotlib>=3.5"]

[project.urls]
Homepage = "https://github.com/marinerhemant/MIDAS"
Documentation = "https://github.com/marinerhemant/MIDAS/tree/master/packages/midas_pink"
Issues = "https://github.com/marinerhemant/MIDAS/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["midas_pink*"]
