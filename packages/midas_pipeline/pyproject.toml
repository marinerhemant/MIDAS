[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "midas-pipeline"
version = "0.8.2"
description = "Unified MIDAS HEDM orchestrator. FF is the single-scan degeneracy of PF; one orchestrator, --scan-mode {ff,pf}."
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.9"
authors = [
    {name = "Hemant Sharma", email = "hsharma@anl.gov"},
]
keywords = [
    "MIDAS", "HEDM", "FF-HEDM", "PF-HEDM", "scanning",
    "diffraction", "pipeline", "PyTorch", "multi-detector",
    "crystallography", "polycrystal", "tomography",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.22",
    "torch>=2.0",
    "zarr>=2.14,<3",
    "h5py>=3.7",
    "hdf5plugin>=4.0",
    "tifffile",
    "pandas>=1.5",
    "fabio>=0.14",                        # CBF (Pilatus/Eiger) raw-frame reader
    # Sibling MIDAS packages (shared with midas-ff-pipeline).
    # >=0.1.5: the zip_convert stage runs the zipper (python -m midas_zipper.ff_zip)
    # and midas-peakfit then reads the keys it wrote. 0.1.4's allow-lists carry
    # neither BgSubtract/BgNSectors nor MinPeakSNR, so a param file zipped by it
    # loses all three and the peak search silently runs at the defaults. a440bef6
    # judged the coupling workflow-level because peakfit needs the zipper only in
    # its dev extra -- true for peakfit, not for this package, which invokes the
    # zipper itself.
    "midas-zipper>=0.1.5",                # raw → .MIDAS.zip ingest (pip-portable)
    # The FBP reconstruction backend. midas_pipeline.recon.fbp used to reach
    # it by a sys.path hop into <repo>/TOMO and a shell-out to the MIDAS_TOMO
    # C binary -- which only resolved from a source checkout, and depended on
    # a separately-built binary that had gone three months stale. A real
    # dependency makes the recon work for pip users.
    "midas-tomo>=0.1.0",
    # [cif] (gemmi) is a RUNTIME requirement, not just test-time: the
    # calc_radius_v stage calls midas_hkls.read_cif() to compute theoretical
    # per-ring intensities for the V-map. Without it a clean production
    # install raises CifBackendError at that stage.
    "midas-hkls[cif]>=0.2.0",
    "midas-peakfit>=0.4.6",                # >=0.4.6: deterministic batched-LM grouping (peak fit was not reproducible)
    "midas-transforms>=0.8.2",
    "midas-index>=0.3.0",
    # >=0.7.0: the "c_recipe" refine mode this CLI offers as a choice.
    "midas-fit-grain>=0.7.0",
    # >=0.7.0: reads Completeness as an alias for ConfidenceTol. Below it, the
    # selection keys this pipeline now writes into paramstest are ignored and
    # the user silently gets no grain gate at all.
    "midas-process-grains>=0.7.0",
    "midas-diffract>=0.1.0",
    "midas-parsl-configs>=0.1.0",
    "midas-stress>=0.6.0",                # canonical orientation/diffraction primitives
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0", "pytest-cov", "matplotlib", "ipykernel",
    "midas-hkls[cif]>=0.2.0",
]
notebook = ["matplotlib", "ipykernel", "jupyter"]
# Optional CPU accelerators (Numba JIT). Both merge_scans (per-scan merge
# inner loop) and potts (ICM sweep) detect numba at import time and fall
# back to pure-Python implementations when it's absent. Install for
# production runs on CPU; the JIT speedup is ~20-50× on those loops.
#
# Pin numba>=0.65 (llvmlite>=0.47): older llvmlite (<=0.44) fails to load
# its shared object when torch is imported before numba (observed on
# Linux + torch 2.12). 0.65/0.47 loads cleanly regardless of import order.
fast = ["numba>=0.65"]
# Super-resolution peak search (--run-sr). Optional: sr_midas is imported
# lazily and PipelineConfig fails fast with a clear error if run_sr=True
# without it installed (see config.py::__post_init__).
sr = ["sr-midas>=0.4.0"]

[project.scripts]
midas-pipeline = "midas_pipeline.cli:main"

[project.urls]
Homepage = "https://github.com/marinerhemant/MIDAS"
Documentation = "https://github.com/marinerhemant/MIDAS"
Issues = "https://github.com/marinerhemant/MIDAS/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["midas_pipeline*"]

[tool.setuptools.package-data]
midas_pipeline = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Exclude `slow` by default (the large O(N^2)-reference parity cases run for
# minutes); run them explicitly with `-m slow` or `-m "slow or not slow"`.
addopts = "-ra -q -m 'not slow'"
markers = [
    "slow: full-pipeline regression tests (require golden fixtures)",
    "parity: bit-or-tolerance parity tests vs frozen C-binary output",
    "gpu: tests that require CUDA",
    "mps: tests that require Apple MPS",
]
