[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "midas-dfxm"
version = "0.3.1"
description = "Differentiable forward + inverse for Dark-Field X-ray Microscopy (DFXM): deformation-gradient field imaging through a magnifying objective, and per-dislocation defect-type discrimination, on top of midas-stress / midas-hkls / midas-defect."
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.9"
authors = [
    {name = "Hemant Sharma", email = "hsharma@anl.gov"},
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.20",
    "torch>=2.0",
    # Sibling MIDAS packages -- reused per implementation_plan.md Section 3.
    # Do NOT re-port their primitives.
    "midas-stress",          # orientation matrices, misorientation, strain-frame transforms (torch)
    "midas-hkls>=0.5",       # lattice math, form factors, structure factors, hkl enumeration (torch)
    "midas-2d>=0.1",         # continuous-q structure factor, resolution convolution, detector projection
    "midas-defect",          # Stroh sextic contrast-factor solver, slip systems, GND, rods
    "midas-invert>=0.1",     # shared differentiable-inversion primitives (fit, losses, UQ, design)
    "midas-distortion",      # detector distortion model (single source of truth)
]

[project.optional-dependencies]
viz = ["matplotlib>=3.5"]
dev = ["pytest>=7.0", "matplotlib>=3.5"]

[tool.setuptools]
packages = ["midas_dfxm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: synthetic-data correctness tests (fast, every PR)",
    "autograd: gradient correctness tests (gradcheck or finite-diff)",
    "device: CPU/CUDA/MPS portability tests (skipped if device unavailable)",
    "slow: heavy optimisation/integration tests (run with -m slow)",
]
