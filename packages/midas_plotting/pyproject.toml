[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "midas-plotting"
version = "0.2.0"
description = "Standard plots for MIDAS reconstructions, near-field and far-field: IPF maps and legends, grain maps, pole figures, strain and size distributions."
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [
    {name = "Hemant Sharma", email = "hsharma@anl.gov"},
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.22",
    "matplotlib>=3.5",
    "midas-stress>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "scipy>=1.9",
]

[project.scripts]
midas-plot = "midas_plotting.cli:main"

[tool.setuptools.packages.find]
include = ["midas_plotting*"]
