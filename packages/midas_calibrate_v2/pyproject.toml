[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "midas-calibrate-v2"
version = "0.11.0"
description = "Fully differentiable detector calibration for MIDAS — multi-image, Bayesian, NN-residual, joint forward cake. Coexists with midas-calibrate v1."
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [{name = "Hemant Sharma", email = "hsharma@anl.gov"}]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "midas-params>=0.9.0",  # preflight: better CLI errors + path checks
    "numpy>=1.22",
    "scipy>=1.9",
    "torch>=2.1",
    "midas-distortion>=0.2.0",            # shared distortion model (single source)
    "midas-hkls>=0.1.0",
    "midas-integrate>=0.1.0",
    "midas-peakfit>=0.2.0",
    # >=0.4.0: FittedPoint.snr_baseline, which the per-ring quality filter in
    # pipelines/_common.py aggregates. Below it the attribute is absent and
    # --min-ring-snr silently gates on 0.0, i.e. keeps every ring.
    "midas-calibrate>=0.4.0",
    "h5py>=3.0",
    "hdf5plugin>=4.0",
    "tifffile>=2022.0",
    "midas-zipper>=0.1.1",                # CBF reader in MIDAS orientation (not fabio)
    # scikit-image is a HARD requirement, not an extra: seed/auto_seed.py
    # imports `measure` and `morphology` unconditionally at the top of
    # make_seed, and from_calibrant_image.py imports `measure` twice more.
    # make_seed is on the normal autocalibrate path (pipelines/auto.py,
    # pipelines/diagnostics.py), so a clean install without it raises
    # ModuleNotFoundError the first time anyone seeds a geometry. It went
    # undeclared for as long as the seeder existed, and only surfaced when
    # the threshold-ladder tests became the first to call make_seed in CI.
    "scikit-image>=0.19",
]

[project.optional-dependencies]
bayesian = ["pyro-ppl>=1.8"]
dev = ["pytest>=7", "pandas>=1.5"]
plots = ["matplotlib>=3.5"]
all = ["pyro-ppl>=1.8", "matplotlib>=3.5", "pytest>=7", "pandas>=1.5"]

[project.scripts]
midas-calibrate-v2 = "midas_calibrate_v2.cli:main"
midas-calibrate-v2-pick = "midas_calibrate_v2.gui.ringpicker:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["midas_calibrate_v2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
