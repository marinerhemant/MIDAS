[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "midas-suite"
version = "0.10.1"
description = "Meta-package: installs the MIDAS Python pipeline (FF/NF/PF HEDM, calibration, peakfit, integration, transforms, ODF, stress)."
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Hemant Sharma", email = "hsharma@anl.gov" }]
requires-python = ">=3.9"
keywords = [
    "MIDAS", "HEDM", "3DXRD", "powder diffraction", "tomography",
    "DCT", "Laue", "synchrotron", "crystallography", "PyTorch",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
]

# Floors pinned to the current PyPI version of each sub-package. Bump only
# when a meta-package change actually requires it. Core stays the FF/NF/
# calib/pipeline workhorse stack; the specialized research packages
# (pdf, defect, dfxm, xaf, 2d, grain-odf, pf-odf, pink, joint-ff-calibrate)
# are opt-in modality extras below — with `[all]` pulling everything.
dependencies = [
    # leaves
    "midas-distortion>=0.2.0",     # shared radial-distortion model + RhoD-units guard
    "midas-stress>=0.8.1",
    "midas-params>=0.10.0",
    "midas-hkls>=0.6.0",
    "midas-diffract>=0.7.0",
    "midas-peakfit>=0.5.0",
    "midas-integrate>=0.5.0",
    "midas-integrate-v2>=0.4.0",
    "midas-calibrate>=0.4.0",
    "midas-calibrate-v2>=0.8.0",
    "midas-index>=0.7.5",
    "midas-transforms>=0.8.6",
    "midas-propagate>=0.1.1",      # uncertainty propagation; load-bearing for process-grains v0.4.x Stage 7 σ
    "midas-uq>=0.1.1",             # refiner-anchored bootstrap UQ (per-grain trust_score_anchored)
    "midas-process-grains>=0.9.0", # >=0.6.1 GrainRadius from the right SpotID space (5.5x low);
                                   # >=0.7.0 reads Completeness as an alias for ConfidenceTol -- below it the
                                   # grain-selection keys are parsed and DISCARDED (23710 vs 6132 grains);
                                   # >=0.9.0 'spot_aware' is DISABLED and the default is c_parity. Below it
                                   # the default mode traded -11.6 pp of EBSD precision for +0.1 pp of recall
                                   # and placed 4.1% of its grains outside the physical sample.
    "midas-fit-grain>=0.7.0",      # >=0.6.0 refiner returns its seed positions; >=0.7.0 adds c_recipe
    "midas-tomo>=0.1.0",           # gridrec CT engine; installs Python-only when FFTW/OpenMP are absent
    "midas-dt>=0.1.0",             # XRD-CT: sinogram assembly + both branch orders (fit→recon, recon→fit)
    "midas-nf-preprocess>=0.6.0",
    "midas-nf-fitorientation>=0.9.2",
    "midas-zipper>=0.2.0",         # raw → .MIDAS.zip ingest (pip-portable, no C/source-tree dep).
                                   # >=0.2.0 param_refresh, which midas-pipeline's zip_convert imports to
                                   # re-read Parameters.txt into an archive that already exists.
    # parsl + pipeline orchestrators
    "midas-parsl-configs>=0.1.0",
    "midas-ff-pipeline>=0.6.0",    # DEPRECATED → use midas-pipeline --scan-mode ff; removed in suite 1.0
    "midas-nf-pipeline>=0.6.1",
    "midas-pipeline>=0.15.0",      # >=0.7.0 FF refinement precision default + unrefined-position guard;
                                   # >=0.8.0 fit-grain/process-grains floors; >=0.8.2 the zipper floor;
                                   # >=0.12.0 preflight: a run whose inputs are missing exits 2 instead
                                   # of skipping every stage and exiting 0. Floored, not merely
                                   # preferred, because the old behaviour is silent data loss.
                                   # >=0.15.0 c-omp is the ONLY backend for indexing and refinement.
                                   # Below it refine_backend defaulted to python+torch+CUDA, so
                                   # `--indexer-backend c-omp` read as "on the C path" while
                                   # refinement silently ran on the GPU and died with no traceback.
]

[project.optional-dependencies]
# Modality bundles for users who don't want the full pipeline.
# Each bundle pulls only what its target workflow needs; sub-package
# transitive deps fill in the rest. The ff/nf extras intentionally pull
# the corresponding pipeline orchestrator at the top — that package's
# own dep list pulls everything it needs underneath.
ff = [
    "midas-stress>=0.8.1",
    "midas-params>=0.10.0",
    # The supported FF orchestrator. Without it `midas-pipeline run
    # --scan-mode ff` -- the command the FF handbook tells users to run -- is
    # simply not installed, because midas-ff-pipeline does not depend on it.
    # >=0.8.0 carries the fit-grain/process-grains floors from 3d9bb427.
    # >=0.12.0 is the preflight release: below it, a mistyped --params or a
    # wrong RawFolder skipped every FF stage and still exited 0.
    "midas-pipeline>=0.15.0",
    "midas-ff-pipeline>=0.6.0",    # DEPRECATED → use midas-pipeline --scan-mode ff; removed in suite 1.0
    "midas-calibrate>=0.4.0",          # >=0.2.7: paramstest parser strips ';' terminator
    "midas-integrate>=0.5.0",
    "midas-joint-ff-calibrate>=0.4.0", # grain-tx + full-joint refine (IUCrJ 2026)
]
nf = [
    "midas-stress>=0.8.1",
    "midas-params>=0.10.0",
    "midas-nf-pipeline>=0.6.1",
]
pf = [
    # Point-focus / scanning HEDM (pf-HEDM). midas-pipeline runs in
    # --scan-mode pf and pulls index + fit-grain + transforms +
    # stress transitively; we list the orchestrator at the top.
    "midas-stress>=0.8.1",
    "midas-params>=0.10.0",
    "midas-pipeline[fast]>=0.15.0",        # >=0.7.0: as above; fast = numba>=0.65;
                                           # >=0.12.0 preflight (see base deps)
    "midas-calibrate>=0.4.0",
    "midas-integrate>=0.5.0",
]
calib = [
    "midas-hkls>=0.6.0",
    "midas-integrate>=0.5.0",
    "midas-peakfit>=0.5.0",
    "midas-calibrate>=0.4.0",
]
calib-v2 = [
    # Torch-native differentiable calibration / integration stack.
    # Companion to ``calib`` (v1, C-backed) — both can be installed
    # side-by-side, the v2 spec ↔ v1 paramstest adapter handles handoff.
    "midas-hkls>=0.6.0",
    "midas-calibrate-v2>=0.8.0",
    "midas-integrate-v2>=0.4.0",
    "midas-peakfit>=0.5.0",
]
# --- Specialized-modality bundles (each published 0.1.0, 2026-07) ---
# One research capability each, layered on top of core. Kept OUT of core
# `dependencies` (they carry heavy/optional stacks); opt in per workflow.
pdf = ["midas-pdf>=0.1.1"]              # total scattering / PDF G(r)
defect = ["midas-defect>=0.1.1"]        # diffuse-scattering defect metrology
dfxm = ["midas-dfxm>=0.3.1"]            # dark-field X-ray microscopy fwd/inverse
xaf = ["midas-xaf>=0.1.0"]              # cross-axis faceted HEDM
ultrafast = ["midas-2d>=0.3.1"]         # midas-2d: 2D / ultrafast forward model
grain-odf = ["midas-grain-odf>=0.1.0"]  # per-grain ODF
pf-odf = ["midas-pf-odf>=0.1.0"]        # pf-HEDM per-voxel orientation/strain/ODF
pink = ["midas-pink>=0.1.0"]            # pink-beam HEDM
# DCT + topotomography forward/inverse. An EXTRA only, deliberately not in
# midas_suite.SUBPACKAGES: that tuple is the core install and CI's smoke test
# fails when a listed sub-package is not importable, which is wrong for a
# modality package nobody is required to have.
dct-tt = ["midas-dct-tt>=0.1.0"]        # DCT + topotomography forward/inverse
# Standard MIDAS plots (NF/FF/Laue): IPF maps + legends, grain maps, pole
# figures, strain/size distributions, Laue texture vs chance level. Pulls
# matplotlib transitively, so it supersedes the bare matplotlib this extra
# used to carry before midas-plotting was published.
plots = ["midas-plotting>=0.3.0"]
# Everything: core (base install) + every optional modality above.
all = [
    "midas-joint-ff-calibrate>=0.4.0",
    "midas-pdf>=0.1.1",
    "midas-defect>=0.1.1",
    "midas-dfxm>=0.3.1",
    "midas-xaf>=0.1.0",
    "midas-2d>=0.3.1",
    "midas-grain-odf>=0.1.0",
    "midas-pf-odf>=0.1.0",
    "midas-pink>=0.1.0",
    "midas-plotting>=0.3.0",
    "midas-dct-tt>=0.1.0",
]
dev = ["pytest>=7"]

# Everything a user could reasonably want, in one name.
#
# This exists to fix a NAME, not a missing package. The docs and several of us
# have been telling people to install `midas-suite[full]`, which did not exist
# -- and pip treats an unknown extra as a WARNING, not an error, so those users
# silently got the base dependency set. Measured in a clean venv: 72 packages
# instead of 89. An extra that does not exist fails open, which is the worst
# way for this to be wrong.
#
# What `full` does NOT do is add anything over `all`. It is tempting to say
# `all` is misleadingly named because it lists only the ten leaf packages and
# names no bundle -- true as written, but NOT true of what gets installed,
# because those leaves depend on the modality stacks. Measured, dry-run in an
# empty venv:
#
#     base    72 packages
#     [all]   89 packages  (+17)
#     [full]  89 packages  (+17)      [full] - [all] = nothing
#
# The union form is still the right definition: it is explicit about intent,
# and it cannot drift if a bundle later gains a package that is not reachable
# from any leaf. But do not "simplify" it to an alias for `all` on the theory
# that they differ today -- and do not claim in a release note that it installs
# more than `all`, because it does not.
#
# Self-referential extras need setuptools>=68 (required on line 2). `dev` is
# deliberately excluded -- it is test tooling, not a capability.
full = [
    "midas-suite[all,ff,nf,pf,calib,calib-v2,pdf,defect,dfxm,dct-tt,pink,plots,xaf,grain-odf,pf-odf,ultrafast]",
]

[project.urls]
Homepage = "https://github.com/marinerhemant/MIDAS"
Issues = "https://github.com/marinerhemant/MIDAS/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["midas_suite*"]
